name: 정합성 테스트

# index.html 엔진을 실제로 실행해 data_2026_06_23.xlsx 전 셀을 SheetJS 기준과 대조한다.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data_2026_06_23.xlsx'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/integrity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'data_2026_06_23.xlsx'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/integrity.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # DecompressionStream('deflate-raw') 필요 → Node 20+

      - name: 의존성 설치 (jsdom, xlsx)
        run: npm install --no-audit --no-fund

      - name: 전체 테이블 정합성 검증
        run: npm test
